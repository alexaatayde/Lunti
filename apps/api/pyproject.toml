[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".venv", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Isolated-test mode must be switched on before the app (and its settings) are imported.
"conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["app", "tests"]
markers = ["db: needs TEST_DATABASE_URL (a PostgreSQL server; skipped without it)"]
