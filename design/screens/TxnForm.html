<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Lunti - Add or edit expense</title>
<!-- Lunti design handoff · T3 · Add / edit expense — SRS 3.1.1 · 390×844px artboard. Rendered from TxnForm.dc.html. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*,*::before,*::after{box-sizing:border-box}
h1,h2,h3,h4,p{margin:0}
button{background:transparent;border:0;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
<style>html,body{margin:0;background:#e9ece6}.lunti-artboard{width:390px;min-height:844px;margin:0 auto;position:relative}</style>
</head>
<body>
<div class="lunti-artboard">
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #fbfbf8; color: #111827; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', Inter, 'Segoe UI', Roboto, sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased">

  <header style="padding: 12px 12px; display: grid; grid-template-columns: 96px 1fr 96px; align-items: center; background: rgba(251,251,248,0.9); border-bottom: 1px solid #f3f4f6">
    <a href="Transactions.html" style="height: 40px; padding: 0 8px; display: flex; align-items: center; font-size: 15px; font-weight: 500; color: #4b5563">Cancel</a>
    <h1 style="font-size: 17px; line-height: 24px; font-weight: 700; text-align: center">New expense</h1>
    <span></span>
  </header>

  <main style="flex: 1; min-height: 0; padding: 16px 20px 0; display: flex; flex-direction: column; gap: 16px">

    <section style="background: #f4f7ee; border-radius: 24px; padding: 18px 20px; border: 1px solid #e3ebd9; text-align: center">
      <label style="display: block">
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.05em; color: #6b7280; text-transform: uppercase">Amount</span>
        <span style="display: flex; align-items: baseline; justify-content: center; gap: 2px; margin-top: 4px">
          <span style="font-size: 26px; font-weight: 800; color: #6b7280">$</span>
          <input type="text" inputmode="decimal" value="6.75" style="width: 170px; border: 0; outline: none; background: transparent; font-size: 40px; line-height: 1.1; font-weight: 900; letter-spacing: -0.025em; color: #111827; text-align: center">
        </span>
      </label>
      
    </section>

    <section style="background: #ffffff; border-radius: 24px; border: 1px solid #f3f4f6; box-shadow: 0 2px 8px rgba(0,0,0,0.02); overflow: hidden">
      <label style="display: flex; align-items: center; gap: 12px; padding: 14px 16px">
        <span style="width: 92px; font-size: 13px; font-weight: 600; color: #6b7280; flex-shrink: 0">Store</span>
        <input type="text" value="Corner Café" placeholder="Where did you buy it?" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 15px; font-weight: 600; color: #111827">
      </label>
      <a href="TxnCategory.html" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid #f3f4f6">
        <span style="width: 92px; font-size: 13px; font-weight: 600; color: #6b7280; flex-shrink: 0">Category</span>
        <span style="flex: 1; display: flex"><span style="display: inline-flex; align-items: center; gap: 6px; background: #edf6e8; color: #3e7525; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 9999px"><span style="width: 8px; height: 8px; border-radius: 9999px; background: #529d33"></span>Dining out</span></span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </a>
      <button type="button" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid #f3f4f6; text-align: left">
        <span style="width: 92px; font-size: 13px; font-weight: 600; color: #6b7280; flex-shrink: 0">Date</span>
        <span style="flex: 1; font-size: 15px; font-weight: 600; color: #111827">Today, May 21 · 8:15 am</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2.5"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>
      </button>
      <label style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid #f3f4f6">
        <span style="width: 92px; font-size: 13px; font-weight: 600; color: #6b7280; flex-shrink: 0">Note</span>
        <input type="text" value="Morning coffee" placeholder="Optional" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 15px; color: #111827">
      </label>
    </section>

    <section style="background: #ffffff; border-radius: 20px; border: 1px solid #f3f4f6; padding: 14px 16px; display: flex; align-items: center; gap: 12px">
      <span style="width: 36px; height: 36px; border-radius: 12px; background: #f3f4f6; color: #374151; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>
      </span>
      <div style="flex: 1; min-width: 0">
        <h3 style="font-size: 14px; line-height: 20px; font-weight: 700">Items</h3>
        <p style="font-size: 12px; line-height: 16px; color: #6b7280">Optional · add what you bought</p>
      </div>
      <button type="button" style="font-size: 13px; font-weight: 600; color: #4f962d">+ Add</button>
    </section>

    <div style="display: flex; align-items: center; gap: 8px; padding: 0 4px; font-size: 12px; line-height: 16px; color: #6b7280">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5a9c39" stroke-width="2" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4M12 8h.01" stroke-linecap="round"></path></svg>
      <span>Your budgets and analytics update as soon as you save.</span>
    </div>
  </main>

  <footer style="padding: 12px 20px 28px; background: #ffffff; border-top: 1px solid #f3f4f6; display: flex; flex-direction: column; gap: 8px">
    <a href="Transactions.html" style="height: 52px; border-radius: 16px; background: #539e2f; color: #ffffff; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 10px 15px -3px rgba(83,158,47,0.25)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7"></path></svg>
      Save expense
    </a>
    
  </footer>
</div>
</div>
</body>
</html>
