<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Lunti - Create account</title>
<!-- Lunti design handoff · A2 · Sign up — SRS 3.5.1, RA 10173 consent · 390×920px artboard. Rendered from SignUp.dc.html. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*,*::before,*::after{box-sizing:border-box}
h1,h2,h3,h4,p{margin:0}
button{background:transparent;border:0;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
<style>html,body{margin:0;background:#e9ece6}.lunti-artboard{width:390px;min-height:920px;margin:0 auto;position:relative}</style>
</head>
<body>
<div class="lunti-artboard">
<div style="width: 390px; height: 920px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #fbfbf8; color: #111827; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', Inter, 'Segoe UI', Roboto, sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased">

  <header style="padding: 12px 12px 0; display: flex; align-items: center">
    <a href="SignIn.html" style="height: 40px; padding: 0 8px 0 4px; display: flex; align-items: center; gap: 2px; font-size: 15px; font-weight: 600; color: #4f962d">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
      Sign in
    </a>
  </header>

  <section style="padding: 8px 24px 0">
    <div role="img" aria-label="Lunti" style="display: flex; align-items: center; gap: 8px">
      <img src="../assets/lunti-mark.png" alt="" style="width: 34px; height: 36px; display: block">
      <img src="../assets/lunti-wordmark.png" alt="" style="width: 67px; height: 25px; display: block; margin-top: 5px">
    </div>
    <p style="font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: #5a9c39; margin: 16px 0 4px">Start growing your savings</p>
    <h1 style="font-size: 31px; line-height: 1.2; font-weight: 800; letter-spacing: -0.025em">Create your account</h1>
    <p style="font-size: 14px; line-height: 20px; color: #6b7280; margin-top: 6px">Track spending, scan receipts and plan meals from what you already have.</p>
  </section>

  <form style="flex: 1; min-height: 0; margin: 0; padding: 24px 24px 0; display: flex; flex-direction: column; gap: 14px">
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 600; color: #374151">Full name</span>
      <input type="text" value="Alex Reyes" autocomplete="name" style="height: 50px; padding: 0 14px; border-radius: 16px; background: #ffffff; border: 1px solid #e5e7eb; outline: none; font-size: 15px; color: #111827">
    </label>

    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 600; color: #374151">Email</span>
      <input type="email" value="alex@example.com" autocomplete="email" style="height: 50px; padding: 0 14px; border-radius: 16px; background: #ffffff; border: 1px solid #e5e7eb; outline: none; font-size: 15px; color: #111827">
    </label>

    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 600; color: #374151">Password</span>
      <span style="height: 50px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 14px; border-radius: 16px; background: #ffffff; border: 1px solid #e5e7eb">
        <input type="password" value="leafygreens24" autocomplete="new-password" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 15px; color: #111827; letter-spacing: 0.1em">
        <button type="button" aria-label="Show password" style="width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #6b7280">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </span>
      <span style="display: flex; flex-direction: column; gap: 6px; margin-top: 2px">
        <span aria-hidden="true" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
          <span style="height: 4px; border-radius: 9999px; background: #5ca833"></span>
          <span style="height: 4px; border-radius: 9999px; background: #5ca833"></span>
          <span style="height: 4px; border-radius: 9999px; background: #5ca833"></span>
          <span style="height: 4px; border-radius: 9999px; background: #e5e7eb"></span>
        </span>
        <span style="font-size: 12px; color: #6b7280"><b style="color: #3e7525">Good password</b> · at least 8 characters with a number</span>
      </span>
    </label>

    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 600; color: #374151">Confirm password</span>
      <span style="height: 50px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-radius: 16px; background: #ffffff; border: 1px solid #e5e7eb">
        <input type="password" value="leafygreens24" autocomplete="new-password" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 15px; color: #111827; letter-spacing: 0.1em">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#539e2f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Passwords match"><path d="M5 13l4 4L19 7"></path></svg>
      </span>
    </label>

    <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 18px; background: #f4f7ee; border: 1px solid #e3ebd9; margin-top: 2px">
      <label style="display: flex; align-items: flex-start; gap: 10px; font-size: 13px; line-height: 18px; color: #374151">
        <input type="checkbox" checked="" style="width: 18px; height: 18px; accent-color: #539e2f; margin: 0; flex-shrink: 0">
        <span>I agree to the <button type="button" style="font-weight: 700; color: #4f962d">Terms of Use</button> and <button type="button" style="font-weight: 700; color: #4f962d">Privacy Notice</button>.</span>
      </label>
      <label style="display: flex; align-items: flex-start; gap: 10px; font-size: 13px; line-height: 18px; color: #374151">
        <input type="checkbox" checked="" style="width: 18px; height: 18px; accent-color: #539e2f; margin: 0; flex-shrink: 0">
        <span>I consent to Lunti processing my receipts and spending data to give me budgets and suggestions, as required by the Data Privacy Act of 2012.</span>
      </label>
    </div>

    <a href="Home.html" style="height: 52px; border-radius: 16px; background: #539e2f; color: #ffffff; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 4px; box-shadow: 0 10px 15px -3px rgba(83,158,47,0.3)">
      Create account
    </a>
  </form>

  <footer style="padding: 16px 24px 32px; display: flex; justify-content: center">
    <p style="font-size: 14px; color: #6b7280">Already have an account? <a href="SignIn.html" style="font-weight: 700; color: #4f962d">Sign in</a></p>
  </footer>
</div>
</div>
</body>
</html>
