<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lunti Scan receipt - camera</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#86D9A6}a:hover{color:#B8EBCB}</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #0F1A14; font-family: 'DM Sans', system-ui, sans-serif; color: #FFFFFF; overflow: hidden">

  <header style="padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Home.dc.html" style="height: 40px; padding: 0 12px; display: flex; align-items: center; gap: 6px; border-radius: 20px; color: #FFFFFF; font-size: 15px; font-weight: 500; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>Cancel</a>
      <h1 style="margin: 0; font-size: 17px; font-weight: 700">Scan receipt</h1>
      <span style="width: 84px; text-align: right; font-size: 13px; color: #A3B5AA">Step 1 of 3</span>
    </div>
    <ol aria-label="Progress" style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; font-size: 12px">
      <li aria-current="step" style="display: flex; flex-direction: column; gap: 6px; color: #FFFFFF; font-weight: 700"><span style="height: 4px; border-radius: 2px; background: #86D9A6"></span>Capture</li>
      <li style="display: flex; flex-direction: column; gap: 6px; color: #A3B5AA"><span style="height: 4px; border-radius: 2px; background: #2C3A32"></span>Processing</li>
      <li style="display: flex; flex-direction: column; gap: 6px; color: #A3B5AA"><span style="height: 4px; border-radius: 2px; background: #2C3A32"></span>Review</li>
    </ol>
  </header>

  <section aria-label="Camera preview" style="flex: 1; min-height: 0; margin: 0 16px; border-radius: 24px; background: #1B2621; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden">
    <div aria-hidden="true" style="width: 190px; height: 400px; background: #E9ECE6; border-radius: 4px; transform: rotate(-2deg); padding: 22px 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; opacity: 0.92">
      <div style="height: 10px; width: 60%; align-self: center; background: #9AA39D; border-radius: 2px"></div>
      <div style="height: 6px; width: 40%; align-self: center; background: #BCC3BE; border-radius: 2px"></div>
      <div style="height: 1px; background: #BCC3BE; margin: 6px 0"></div>
      <div style="display: flex; justify-content: space-between"><div style="height: 6px; width: 55%; background: #BCC3BE; border-radius: 2px"></div><div style="height: 6px; width: 20%; background: #BCC3BE; border-radius: 2px"></div></div>
      <div style="display: flex; justify-content: space-between"><div style="height: 6px; width: 45%; background: #BCC3BE; border-radius: 2px"></div><div style="height: 6px; width: 20%; background: #BCC3BE; border-radius: 2px"></div></div>
      <div style="display: flex; justify-content: space-between"><div style="height: 6px; width: 60%; background: #BCC3BE; border-radius: 2px"></div><div style="height: 6px; width: 20%; background: #BCC3BE; border-radius: 2px"></div></div>
      <div style="display: flex; justify-content: space-between"><div style="height: 6px; width: 35%; background: #BCC3BE; border-radius: 2px"></div><div style="height: 6px; width: 20%; background: #BCC3BE; border-radius: 2px"></div></div>
      <div style="display: flex; justify-content: space-between"><div style="height: 6px; width: 50%; background: #BCC3BE; border-radius: 2px"></div><div style="height: 6px; width: 20%; background: #BCC3BE; border-radius: 2px"></div></div>
      <div style="height: 1px; background: #BCC3BE; margin: 6px 0"></div>
      <div style="display: flex; justify-content: space-between"><div style="height: 8px; width: 30%; background: #9AA39D; border-radius: 2px"></div><div style="height: 8px; width: 28%; background: #9AA39D; border-radius: 2px"></div></div>
    </div>
    <div aria-hidden="true" style="position: absolute; left: 50px; right: 50px; top: 50px; bottom: 90px; border: 2px dashed rgba(134,217,166,0.7); border-radius: 16px"></div>
    <div style="position: absolute; left: 16px; right: 16px; bottom: 20px; display: flex; justify-content: center">
      <span style="padding: 8px 14px; border-radius: 16px; background: rgba(15,26,20,0.82); font-size: 13px; color: #FFFFFF; text-align: center">Fit the whole receipt in the frame · flat and well lit</span>
    </div>
  </section>

  <div style="padding: 22px 28px 34px; display: flex; align-items: center; justify-content: space-between">
    <button type="button" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; color: #FFFFFF; font-family: inherit; font-size: 12px; cursor: pointer">
      <span style="width: 48px; height: 48px; border-radius: 14px; background: #24322A; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="m20.5 16-5-5-8 8.5"></path></svg></span>
      Gallery
    </button>
    <a href="ScanReview.dc.html" aria-label="Capture receipt" style="width: 78px; height: 78px; box-sizing: border-box; border-radius: 39px; border: 4px solid #FFFFFF; background: transparent; display: flex; align-items: center; justify-content: center">
      <span style="width: 60px; height: 60px; border-radius: 30px; background: #86D9A6"></span>
    </a>
    <button type="button" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; color: #FFFFFF; font-family: inherit; font-size: 12px; cursor: pointer">
      <span style="width: 48px; height: 48px; border-radius: 14px; background: #24322A; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3 5 13.5h6L10 21l8-10.5h-6Z"></path></svg></span>
      Flash
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
